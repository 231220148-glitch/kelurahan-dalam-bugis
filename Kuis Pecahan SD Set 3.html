:root {
  --bg: #EEF3F8;
  --grid: #DCE5EF;
  --surface: #FFFFFF;
  --ink: #13233B;
  --ink-2: #4A5B73;
  --line: #C5D1E0;
  --accent: #1B4DD6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EBFF;
  --accent-edge: #0F36A0;
  --pencil: #F5B400;
  --on-pencil: #3B2A00;
  --good: #0B7350;
  --good-soft: #DDF4EA;
  --on-good: #FFFFFF;
  --bad: #B92D24;
  --bad-soft: #FBE4E1;
  --on-bad: #FFFFFF;
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

    --ink-2: #9DB0C9;
    --line: #2C3D5A;
    --accent: #7FA2FF;
    --accent-ink: #0B1530;
    --accent-soft: #1F3159;
    --accent-edge: #4B6FD0;
    --pencil: #F5C542;
    --on-pencil: #3B2A00;
    --good: #4FD1A0;
    --good-soft: #123A2E;
    --on-good: #0A2A20;
    --bad: #FF8A80;
    --bad-soft: #43201F;
    --on-bad: #3A0F0C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1726;
  --grid: #16233A;
  --surface: #162238;
  --ink: #E8EEF8;
  --ink-2: #9DB0C9;
  --line: #2C3D5A;
  --accent: #7FA2FF;
  --accent-ink: #0B1530;
  --accent-soft: #1F3159;
  --accent-edge: #4B6FD0;
  --pencil: #F5C542;

*, *::before, *::after { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin-inline: auto; }
[tabindex="-1"]:focus { outline: none; }

.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.modeLabel { font-size: .82rem; color: var(--ink-2); font-weight: 500; }

.card {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: clamp(18px, 4.5vw, 30px);
  box-shadow: 0 3px 0 var(--line);
}
.eyebrow { margin: 0 0 6px; font-size: .76rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 7vw, 2.7rem); line-height: 1.1; }
.lead { margin: 12px 0 0; max-width: 60ch; color: var(--ink-2); }

/* pecahan bersusun */
.mn { display: inline-flex; align-items: center; gap: .16em; vertical-align: middle; white-space: nowrap; margin: 0 .1em; }
.mn .w { font-weight: 500; }
.fr { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: .92em; font-variant-numeric: tabular-nums; }
.fr .n { padding: 0 .3em .09em; border-bottom: .085em solid currentColor; }
.fr .d { padding: .09em .3em 0; }

/* layar awal */
.demo { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; font-family: var(--font-display); font-size: 2.2rem; }
.strip { display: inline-grid; grid-template-columns: repeat(4, 28px); gap: 3px; }
.strip i { height: 22px; border: 1.5px solid var(--ink); border-radius: 4px; }
.strip i.on { background: var(--pencil); }
.chips { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { display: inline-flex; gap: 8px; align-items: center; font-size: .85rem; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.chips li b { font-weight: 600; color: var(--accent); }
form { margin-top: 24px; display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
label.lb, .field label, legend { font-size: .88rem; font-weight: 600; }
input[type="text"] {
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 14px; width: 100%; min-height: 48px;
}
input[type="text"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.mode { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: var(--surface); }

.mode input { margin-top: 5px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }

.mode span { display: grid; gap: 2px; min-width: 0; }
.mode small { color: var(--ink-2); font-size: .85rem; line-height: 1.4; }
.note { margin: 16px 0 0; font-size: .85rem; color: var(--ink-2); }

.btn {

  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 3px 0 var(--accent-edge);

.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-edge); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

.qnum { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.tag { font-size: .8rem; color: var(--ink-2); }

.fb.no { background: var(--bad-soft); border-color: var(--bad); }

.rev summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
.st { flex: none; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; line-height: 1.6; margin-top: .35em; }
.rev.ok .st { background: var(--good-soft); color: var(--good); }
.rev.no .st { background: var(--bad-soft); color: var(--bad); }
.rq { min-width: 0; }
.rb { border-top: 1px dashed var(--line); padding: 10px 14px 14px; }
.rb p { margin: 4px 0; line-height: 1.9; }

@media (max-width: 420px) {
  .opt { font-size: 1.12rem; gap: 10px; padding: 8px 10px; }
  .opt .mark { display: none; }
}

    begin(Q.map((_, k) => k));
  });
  document.addEventListener('keydown', e => {
    if (S.screen !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.matches && e.target.matches('input, textarea')) return;
    const k = ['a', 'b', 'c', 'd', '1', '2', '3', '4'].indexOf(e.key.toLowerCase());
    if (k > -1) { pick(k % 4); return; }
    if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button, a, summary'))) {
      const b = app.querySelector('[data-act="next"]');
      if (b && !b.disabled) next();
    }
  });

  render();
})();
</script>
